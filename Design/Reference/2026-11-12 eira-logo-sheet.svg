  <path d="M44,-34 C36,-30 30,-23 26,-11 C21,3 19,19 22,24 C25,28 33,18 38,8 C44,-4 47,-24 44,-34Z" fill="currentColor"/>
  <path d="M49,-32 C45,-23 43,-8 44,6 C45,21 50,35 54,35 C59,33 63,16 61,1 C59,-14 55,-26 49,-32Z" fill="currentColor"/>
  <path d="M56,-32 C66,-28 78,-19 84,-7 C89,4 90,16 87,19 C83,22 72,15 66,8 C59,0 55,-16 56,-32Z" fill="currentColor"/>
</g>
</defs>
<!-- Top row: cream symbol, dark green discs -->
<g transform="translate(117 289) scale(.41)"><circle r="100" fill="#06472A"/><g style="color:#F8F1E5"><use href="#snowdropMini"/></g></g>
