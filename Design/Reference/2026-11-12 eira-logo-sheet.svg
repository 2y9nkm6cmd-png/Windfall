  <path d="M-50,80 C-58,60 -73,47 -85,39 C-78,40 -62,42 -49,55 C-43,62 -46,71 -50,80Z" fill="currentColor"/>
  <path d="M-50,80 C-45,64 -36,53 -21,44 C-27,60 -37,72 -50,80Z" fill="currentColor"/>
</g>
<g id="snowdropMini">
