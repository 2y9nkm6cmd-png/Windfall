<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<rect width="1800" height="550" fill="#F8F1E5"/>
<rect x="0" y="550" width="1800" height="550" fill="#101512"/>
<defs>
<g id="snowdropFull">
  <!-- tapered, arched botanical stem -->
  <path d="M-53,79 C-56,31 -51,-8 -33,-42 C-17,-71 4,-83 24,-77 C38,-73 47,-61 50,-47 L45,-46 C41,-62 33,-70 22,-73 C3,-78 -14,-62 -28,-39 C-46,-6 -47,34 -47,79 Z" fill="currentColor"/>
  <!-- one tiny nodding ovary, no lamp-like rim -->
  <path d="M45,-48 C44,-43 43,-38 43,-35 C47,-32 52,-31 55,-32 C55,-38 53,-44 49,-48 C48,-49 47,-49 45,-48Z" fill="currentColor"/>
  <!-- three separate, slim, asymmetrical petals, with fine open negative-space separations -->
